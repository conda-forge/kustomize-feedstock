schema_version: 1

context:
  name: kustomize
  version: "5.7.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/kubernetes-sigs/${{ name }}/archive/refs/tags/${{ name }}/v${{ version }}.tar.gz
  sha256: 9e3907f0ea58426a5a4f64a457e83bbe0a1370ca76048556146f38b52d5fa5f1

build:
  number: 1
  skip: win

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - if: not win
        then: kustomize version

about:
  summary: Kubernetes native configuration management
  description: |
    kustomize lets you customize raw, template-free YAML files for multiple purposes, leaving the original YAML untouched and usable as is.
    kustomize targets kubernetes; it understands and can patch kubernetes style API objects. It's like make, in that what it does is declared in a file, and it's like sed, in that it emits edited text.
  license: Apache-2.0
  license_file:
    - LICENSE
    - kustomize/license-files/
  homepage: https://kustomize.io/
  repository: https://github.com/kubernetes-sigs/kustomize
  documentation: https://kubectl.docs.kubernetes.io/

extra:
  recipe-maintainers:
    - levsha
    - xhochy
